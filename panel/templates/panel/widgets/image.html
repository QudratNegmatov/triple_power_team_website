<div class="upload" data-upload>
    <div class="upload-preview">{% if widget.is_initial %}<img src="{{ widget.value.url }}" alt="" data-preview>{% else %}<img alt="" data-preview hidden><span class="upload-empty" data-preview-empty>Rasm yo'q</span>{% endif %}</div>
    <div class="upload-controls">
        <label class="btn btn-ghost btn-small upload-btn">{% if widget.is_initial %}Boshqa rasm tanlash{% else %}Rasm tanlash{% endif %}
            <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
        </label>
        <span class="muted small" data-file-name></span>
        {% if widget.is_initial and not widget.required %}
        <label class="clear-check"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"> Rasmni olib tashlash</label>
        {% endif %}
    </div>
</div>
