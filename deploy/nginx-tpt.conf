# Nginx site for the website. Replace example.com with the real domain, then:
#   sudo cp deploy/nginx-tpt.conf /etc/nginx/sites-available/tpt
#   sudo ln -s /etc/nginx/sites-available/tpt /etc/nginx/sites-enabled/tpt
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS is added afterwards by: sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 50M;  # admin image/video uploads

    location /static/ {
        alias /srv/tpt/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploaded files, when they are stored on this server instead of Cloudinary.
    location /media/ {
        alias /srv/tpt/app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/tpt/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
